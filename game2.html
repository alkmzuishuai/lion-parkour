<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lion Parkour</title>
<style>
html,body{margin:0;background:#0a0c14;overflow:hidden;height:100%;font-family:"Microsoft YaHei",sans-serif}body{display:grid;place-items:center}#game{display:block;width:min(100vw,480px);height:min(100vh,640px);background:#0a0c14;touch-action:none}.hint{position:fixed;top:8px;color:#999;font-size:12px;opacity:.7}
</style>
</head>
<body><canvas id="game" width="480" height="640"></canvas>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=480,H=640;
const lanes=[80,240,400], keys={}; let score,coins,over,spawn,coinSpawn,player,obstacles,items,last=0;
function reset(){score=0;coins=0;over=false;spawn=0;coinSpawn=0;player={lane:1,x:220,y:480,jump:0};obstacles=[];items=[]}
function jump(){if(!over&&player.jump===0)player.jump=40}
function move(n){if(!over)player.lane=Math.max(0,Math.min(2,player.lane+n))}
function obstacle(){const lane=Math.floor(Math.random()*3);obstacles.push({x:lanes[lane]-20,y:-40,s:5+Math.floor(score/300)})}
function coin(){const lane=Math.floor(Math.random()*3);items.push({x:lanes[lane]-12,y:-24,s:5+Math.floor(score/300),v:[1,3,4][Math.floor(Math.random()*3)]})}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function text(t,x,y,size,color='#fff'){ctx.fillStyle=color;ctx.font=size+'px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText(t,x,y)}
function drawLion(){let lift=player.jump?Math.floor(48*4*(1-Math.min(player.jump,40)/40)*(Math.min(player.jump,40)/40)):0,x=player.x,y=player.y-lift;ctx.fillStyle='#ff8c00';ctx.fillRect(x+8,y+18,24,18);ctx.fillStyle='#ffd200';ctx.fillRect(x+14,y+22,12,10);ctx.fillStyle='#ff8c00';ctx.fillRect(x+10,y+4,20,16);ctx.fillStyle='#ffd200';ctx.fillRect(x+14,y+8,12,10);ctx.fillStyle='#784614';ctx.fillRect(x+6,y+6,4,10);ctx.fillRect(x+30,y+6,4,10);ctx.fillRect(x+8,y+2,6,4);ctx.fillRect(x+26,y+2,6,4);ctx.fillRect(x+8,y,4,6);ctx.fillRect(x+28,y,4,6);ctx.fillStyle='#000';ctx.fillRect(x+15,y+10,3,4);ctx.fillRect(x+22,y+10,3,4);ctx.fillRect(x+18,y+14,4,3);ctx.fillStyle='#ff8c00';ctx.fillRect(x+10,y+34,6,6);ctx.fillRect(x+24,y+34,6,6)}
function frame(now){let dt=Math.min(32,now-last);last=now; if(!over){score++;spawn+=dt/16.67;coinSpawn+=dt/16.67;if(spawn>70){obstacle();spawn=0}if(coinSpawn>45){coin();coinSpawn=0}player.x+=(lanes[player.lane]-20-player.x)*.35;if(player.jump)player.jump--;for(const o of obstacles)o.y+=o.s*dt/16.67;for(const c of items)c.y+=c.s*dt/16.67;obstacles=obstacles.filter(o=>o.y<H);items=items.filter(c=>c.y<H);const lion={x:player.x,y:player.y,w:40,h:40};for(const o of obstacles)if(rectHit(lion,{x:o.x,y:o.y,w:40,h:40})&&!player.jump)over=true;items=items.filter(c=>{if(rectHit(lion,{x:c.x,y:c.y,w:24,h:24})){coins+=c.v;return false}return true})}
ctx.fillStyle='#0a0c14';ctx.fillRect(0,0,W,H);for(let x of lanes){ctx.strokeStyle='#282c3c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(const o of obstacles){ctx.fillStyle='#dc2828';ctx.fillRect(o.x,o.y,40,40);ctx.fillStyle='#b41414';ctx.fillRect(o.x+4,o.y+4,32,32)}for(const c of items){ctx.fillStyle='#ffdf00';ctx.fillRect(c.x,c.y,24,24);ctx.fillStyle='#ffb400';ctx.fillRect(c.x+4,c.y+4,16,16)}drawLion();ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='28px "Microsoft YaHei"';ctx.fillText('SCORE:'+score,12,32);ctx.fillStyle='#ffdf00';ctx.fillText('COINS:'+coins,12,64);for(let i=0;i<3;i++){ctx.fillStyle='#283c64';ctx.fillRect([30,190,350][i],H-70,100,50)}text('<',80,H-35,30);text('JUMP',240,H-35,22);text('>',400,H-35,30);if(over&&coins>=52){text('游戏结束',240,280,42,'#dc2828');text('天天开心',240,330,34,'#ffdf00');text('祝你的生活中拥有乐趣',240,370,24);text('点击屏幕或按 Enter 重新开始',240,430,22)}requestAnimationFrame(frame)}
function point(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(over){reset();return}if(y>H-100){if(x<160)move(-1);else if(x>320)move(1);else jump()}else jump()}
canvas.addEventListener('pointerdown',point);addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump();if(over&&e.key==='Enter')reset()});reset();requestAnimationFrame(frame);
</script></body></html>
